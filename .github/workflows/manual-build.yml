name: Manual Release

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: Version bump type
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: rsbot-manual-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Calculate release version
        id: version
        shell: pwsh
        env:
          VERSION_TYPE: ${{ inputs.version_type }}
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$project = Get-Content Application/RSBot/RSBot.csproj
          $version = [version]$project.Project.PropertyGroup.AssemblyVersion
          foreach ($tag in (git tag --list 'v*')) {
            if ($tag -match '^v(\d+\.\d+\.\d+)$') {
              $candidate = [version]$Matches[1]
              if ($candidate -gt $version) { $version = $candidate }
            }
          }
          $major = $version.Major
          $minor = $version.Minor
          $patch = $version.Build
          switch ($env:VERSION_TYPE) {
            major { $major++; $minor = 0; $patch = 0 }
            minor { $minor++; $patch = 0 }
            patch { $patch++ }
            default { throw 'Invalid version type' }
          }
          "number=$major.$minor.$patch" >> $env:GITHUB_OUTPUT
          "tag=v$major.$minor.$patch" >> $env:GITHUB_OUTPUT

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build release
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.number }}
        run: ./build.ps1 -Configuration Release -DoNotStart -Version $env:RELEASE_VERSION

      - name: Install x86 runtime for updater checks
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP dotnet-install.ps1
          Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile $installer
          $runtime = Join-Path $env:RUNNER_TEMP dotnet-x86
          & $installer -Channel 8.0 -Runtime dotnet -Architecture x86 -InstallDir $runtime
          "DOTNET_ROOT_X86=$runtime" >> $env:GITHUB_ENV

      - name: Verify updater installation and rollback
        shell: pwsh
        run: ./scripts/test-updater.ps1

      - name: Package application
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: ./scripts/package-release.ps1 -Tag $env:RELEASE_TAG

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: RSBot ${{ steps.version.outputs.tag }}
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            RSBot.${{ steps.version.outputs.tag }}.zip
            RSBot.${{ steps.version.outputs.tag }}.zip.sha256

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-log
          path: build.log
